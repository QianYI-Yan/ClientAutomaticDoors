//file:noinspection GroovyAssignabilityCheck
plugins {
    // 26.x 是非混淆版本（Mojang 直接发布映射后的 jar），需用 net.fabricmc.fabric-loom 插件（跳过 remap）
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

// 版本号规则：MC版本-构建次数
version = "${minecraft}-${mod_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup("com.terraformersmc")
            includeGroup("dev.emi")
        }
    }
    maven {
        name = "Xander Maven"
        url = "https://maven.isxander.dev/releases"
        content {
            includeGroup("dev.isxander") //yet-another-config-lib-fabric
        }
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release"
        content {
            includeGroup("org.quiltmc.parsers")
        }
    }
    maven {
        url = "https://oss.sonatype.org/content/repositories/snapshots"
        content {
            includeGroupAndSubgroups("com.twelvemonkeys")
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url "https://maven.firstdarkdev.xyz/snapshots"
        content {
            includeGroup("com.lowdragmc.shimmer")
        }
    }
    maven {
        url "https://maven.shedaniel.me"
        content {
            includeGroup("me.shedaniel")
            includeGroup("dev.architectury")
            includeGroup("me.shedaniel.cloth")
        }
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup("org.ladysnake.cardinal-components-api")
        }
    }
    mavenLocal {
        content {
            includeGroup("phoupraw.mcmod")
        }
    }
}

fabricApi {
    configureDataGeneration {
        strictValidation = true
    }
}

dependencies {
    //## 基础依赖
    minecraft "com.mojang:minecraft:${minecraft}"
    implementation "net.fabricmc:fabric-loader:${loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"
    //## mod依赖
    compileOnly "com.terraformersmc:modmenu:${modmenu}"
    //include(implementation("phoupraw.mcmod:TrilevelConfig-26.3:+"))
    //modLocalRuntime modCompileOnly("dev.isxander:yet-another-config-lib:${yacl}")
    //modLocalRuntime modCompileOnly("dev.emi:emi-fabric:${emi}")
    /////*modLocalRuntime*/ modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei}")
    //modLocalRuntime modCompileOnly("curse.maven:jade-324717:${jade}")
    ///*modLocalRuntime*/ modCompileOnly("curse.maven:ftb-ultimine-fabric-448231:5448788")
    //modApi("dev.emi:trinkets:${trinkets}")
    //## 非mod依赖
    //## 非依赖
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
    exclude("net/fabricmc/*")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${archives_base_name}-${minecraft}"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {

    }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accessWidener")
    runs {
        datagen {
            inherit(client)
            property("fabric-api.datagen.modid", "${mod_id}")
        }
        client {
            programArg("--username=Phoupraw")
            // 复用 PCL 已下载的资源，避免再走 Mojang 官方源（国内易失败）
            programArgs("--assetsDir", "D:/minecraft/Dev/assets", "--assetIndex", "34")
            if (project.hasProperty("quickPlayWorld")) {
                programArgs("--quickPlaySingleplayer", project.property("quickPlayWorld").toString())
            }
        }
    }
}